<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>かけい簿</title>
<meta name="description" content="生活費の支出だけを、大きな文字で記録するアプリ">
<meta name="theme-color" content="#FDE0E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かけい簿">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="icon" href="./assets/icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- ============ 起動アニメーション ============ -->
<div id="splash" class="splash">
  <div class="splash-name">かけい簿</div>
  <div class="mold">
    <div class="mold-ghost"></div>
    <div class="mold-liquid"><div class="mold-fill"></div></div>
    <div class="mold-real"></div>
  </div>
  <div class="splash-pct" id="splashPct">0%</div>
  <div class="splash-meter"><i id="splashBar"></i></div>
</div>

<!-- ============ メイン画面 ============ -->
<div id="app" class="app" aria-hidden="true">

  <div class="nav">
    <button type="button" id="btnPrev" class="navbtn">←先月</button>
    <button type="button" id="btnNow" class="navbtn now hide">→今月へ</button>
  </div>

  <div class="total">
    <div class="total-label" id="totalLabel">9月支出合計</div>
    <div class="total-yen"><span id="totalYen">0</span><small>円</small></div>
  </div>

  <div class="legend">
    <span><i class="sw-cur"></i><b id="legendCur">今月</b></span>
    <span><i class="sw-prev"></i><b id="legendPrev">先月</b></span>
  </div>

  <div class="chart" id="chart"></div>

  <div class="foot">
    <img class="chars" src="./assets/chars.png" alt="" aria-hidden="true">
    <button type="button" id="btnAdd" class="plus" aria-label="入力する">
      <span class="plus-p">＋</span><span class="plus-t">入力</span>
    </button>
    <button type="button" id="btnShare" class="send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m21 3-9.5 9.5M21 3l-6.5 18-4-8-8-4Z"/></svg>送る
    </button>
    <div class="viewonly" id="viewOnly">見るだけの<br>画面です</div>
  </div>
</div>

<!-- ============ かさねて出すもの ============ -->
<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></div>
<div id="confirm" class="confirm" hidden role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="./app.js" defer></script>
</body>
</html>
