<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>かけい簿 レイアウト案</title>
<style>
:root{
  --cream:#FFF6E9; --cream2:#FFFCF5; --card:#FFFFFF;
  --ink:#2E2118; --ink2:#6E5A48; --muted:#9C8977;
  --pink:#F49BB8; --pink-strong:#DE4E84; --pink-pale:#FDE0E9;
  --green:#5FA03F; --green-deep:#3C7528; --green-pale:#E4F0D9;
  --prev:#D7C7B0;
  --past-bg:#E4EDF6; --past-card:#F6FAFD; --past-ink:#1F4360;
  --past-bar:#2F7AA8; --past-prev:#B6CCDC; --past-line:#C6D9E7;
  --line:#E7D9C5;
  --sh:0 2px 0 rgba(0,0,0,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
body{margin:0;background:#443A32;color:#fff;
     font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif}
.page{padding:18px 14px 50px;max-width:1560px;margin:0 auto}
h1{font-size:21px;margin:0 0 4px}
.sub{font-size:13.5px;opacity:.8;margin:0 0 18px;line-height:1.75}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.frame{width:360px}
.cap{font-size:14.5px;font-weight:700;margin:0 0 6px;text-align:center}
.cap small{display:block;font-weight:400;opacity:.72;font-size:12px;margin-top:2px;line-height:1.5}
.phone{width:360px;height:740px;border-radius:32px;overflow:hidden;
       border:7px solid #191613;box-shadow:0 10px 26px rgba(0,0,0,.45);position:relative}

/* ==================== アプリ本体 ==================== */
.app{position:absolute;inset:0;overflow:hidden;background:var(--cream);color:var(--ink);
     display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;
     font-family:inherit}
.app.past{background:var(--past-bg);color:var(--past-ink)}

/* --- 上部ナビ --- */
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px 0}
.navbtn{min-height:clamp(52px,7.4vh,60px);padding:0 16px;border:3px solid currentColor;
        border-radius:15px;background:#fff;color:var(--ink);
        font-size:clamp(19px,2.9vh,23px);font-weight:800;box-shadow:var(--sh);
        display:flex;align-items:center;white-space:nowrap}
.navbtn.hide{visibility:hidden}
.navbtn.off{opacity:.28}
.navbtn.now{background:var(--green);border-color:var(--green-deep);color:#fff}

/* --- 合計 --- */
.total{text-align:center;padding:3px 10px 0}
.total .lbl{font-size:clamp(19px,2.9vh,24px);font-weight:800;color:var(--ink2);line-height:1.3}
.app.past .total .lbl{color:#2B5A7B}
.total .yen{font-size:clamp(44px,7.2vh,60px);font-weight:900;line-height:1.1;letter-spacing:-.02em}
.total .yen small{font-size:.52em;font-weight:800;margin-left:2px}
.badge{display:inline-block;background:var(--past-bar);color:#fff;
       font-size:clamp(15px,2.3vh,19px);font-weight:800;border-radius:999px;
       padding:1px 12px;margin-left:6px;vertical-align:3px}
.legend{display:flex;justify-content:center;gap:16px;padding:3px 0 4px;
        font-size:clamp(14px,2.2vh,18px);font-weight:800;color:var(--ink2)}
.app.past .legend{color:#3A6B8C}
.legend i{display:inline-block;width:20px;height:11px;border-radius:3px;margin-right:5px}
.legend .a{background:var(--green)} .legend .b{background:var(--prev)}
.app.past .legend .a{background:var(--past-bar)} .app.past .legend .b{background:var(--past-prev)}

/* --- グラフ --- */
.chart{display:flex;flex-direction:column;gap:5px;padding:0 11px 4px;min-height:0}
.cat{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;
     gap:clamp(3px,.6vh,6px);background:var(--card);border:2px solid var(--line);
     border-radius:13px;padding:4px 11px 6px;overflow:hidden}
.app.past .cat{background:var(--past-card);border-color:var(--past-line)}
.cat .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cat .name{font-size:clamp(21px,3.3vh,26px);font-weight:900;display:flex;align-items:center;
           gap:6px;white-space:nowrap;line-height:1.15}
.cat .name svg{width:1.04em;height:1.04em;flex:none;transform:translateY(.08em)}
.cat .amt{font-size:clamp(21px,3.3vh,26px);font-weight:900;white-space:nowrap;line-height:1.15}
.cat .amt small{font-size:.74em;margin-left:1px}
.cat .none{font-size:clamp(18px,2.8vh,22px);font-weight:800;color:var(--muted);white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{height:clamp(14px,2.4vh,20px);border-radius:0 7px 7px 0;background:var(--green);min-width:5px}
.bar.prev{height:clamp(7px,1.2vh,10px);background:var(--prev);border-radius:0 5px 5px 0}
.app.past .bar{background:var(--past-bar)} .app.past .bar.prev{background:var(--past-prev)}

/* --- 下部 --- */
.foot{position:relative;height:clamp(126px,20vh,158px)}
.chars{position:absolute;left:-10px;bottom:0;width:clamp(134px,22vh,174px);
       pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.13))}
.plus{position:absolute;bottom:4px;left:56%;transform:translateX(-50%);
      width:clamp(84px,13.4vh,100px);aspect-ratio:1;border-radius:50%;
      background:var(--pink-strong);color:#fff;border:5px solid #fff;
      box-shadow:0 5px 0 rgba(150,40,80,.32),0 8px 18px rgba(0,0,0,.22);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-weight:900;line-height:1;z-index:2;font-size:clamp(84px,13.4vh,100px)}
.plus .p{font-size:.52em;margin-top:-.04em} .plus .t{font-size:.16em;margin-top:.05em}
.send{position:absolute;right:8px;top:1px;min-height:clamp(56px,8.6vh,64px);padding:0 16px;
      border-radius:15px;border:3px solid var(--green-deep);background:#fff;color:var(--green-deep);
      font-size:clamp(20px,3vh,23px);font-weight:900;display:flex;align-items:center;gap:6px;
      box-shadow:var(--sh);z-index:2}
.viewonly{position:absolute;right:8px;top:6px;background:rgba(255,255,255,.94);
          border:2px solid var(--past-bar);color:var(--past-ink);border-radius:13px;
          padding:8px 14px;font-size:clamp(18px,2.7vh,21px);font-weight:800;z-index:2;
          text-align:center;line-height:1.4}

/* ==================== 入力シート ==================== */
.scrim{position:absolute;inset:0;background:rgba(46,33,24,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream2);
       border-radius:24px 24px 0 0;border-top:4px solid var(--pink);
       padding:14px 14px 16px;box-shadow:0 -8px 30px rgba(0,0,0,.3);color:var(--ink)}
.sheet h2{font-size:clamp(23px,3.4vh,27px);font-weight:900;text-align:center;margin:2px 0 13px}
.opt{width:100%;min-height:clamp(76px,11.6vh,88px);border-radius:17px;border:3px solid var(--ink);
     background:#fff;color:var(--ink);font-size:clamp(23px,3.5vh,27px);font-weight:900;
     display:flex;align-items:center;gap:13px;padding:0 15px;margin-bottom:10px;
     box-shadow:var(--sh);text-align:left;line-height:1.15}
.opt svg{width:1.45em;height:1.45em;flex:none}
.opt.one{background:var(--pink-pale);border-color:var(--pink-strong)}
.opt.two{background:var(--green-pale);border-color:var(--green-deep)}
.opt .s{display:block;font-size:.59em;font-weight:700;color:#8A7563;margin-top:3px}
.del{width:100%;min-height:64px;border-radius:15px;border:3px dashed #B9A794;background:transparent;
     color:#7A6653;font-size:21px;font-weight:800;margin-top:4px}
.close{width:100%;min-height:64px;border-radius:15px;border:3px solid var(--ink);
       background:#EDE2D2;color:var(--ink);font-size:23px;font-weight:900;margin-top:9px}

/* --- テンキー --- */
.khead{text-align:center;font-size:clamp(20px,3vh,23px);font-weight:800;color:var(--ink2);margin:0 0 9px}
.kfield{background:#fff;border:4px solid var(--ink);border-radius:15px;min-height:76px;
        display:flex;align-items:center;justify-content:flex-end;padding:0 15px;
        font-size:clamp(38px,5.8vh,46px);font-weight:900;margin-bottom:9px}
.kfield .u{font-size:.56em;margin-left:3px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.key{min-height:clamp(58px,8.8vh,68px);border-radius:13px;border:3px solid var(--ink);
     background:#fff;font-size:clamp(27px,4.2vh,32px);font-weight:900;color:var(--ink);
     box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
.key.fn{background:#EDE2D2;font-size:clamp(19px,2.9vh,23px)}
.key.ok{background:var(--green);border-color:var(--green-deep);color:#fff;font-size:clamp(20px,3.1vh,25px)}

/* --- カテゴリ --- */
.catgrid{display:flex;flex-direction:column;gap:8px}
.catbtn{min-height:clamp(64px,10vh,74px);border-radius:15px;border:3px solid var(--ink);
        background:#fff;color:var(--ink);font-size:clamp(23px,3.5vh,27px);font-weight:900;
        display:flex;align-items:center;gap:11px;padding:0 15px;box-shadow:var(--sh)}
.catbtn svg{width:1.22em;height:1.22em;flex:none}
.catbtn.sel{background:var(--green-pale);border-color:var(--green-deep);border-width:5px}

/* --- 確認 --- */
.confirm{position:absolute;inset:0;background:var(--cream);display:flex;flex-direction:column;
         align-items:center;justify-content:center;padding:22px;gap:4px}
.confirm .q{font-size:clamp(22px,3.4vh,27px);font-weight:800;color:var(--ink2)}
.confirm .big{font-size:clamp(58px,10.4vh,84px);font-weight:900;line-height:1.05}
.confirm .big small{font-size:.44em}
.confirm .c{font-size:clamp(28px,4.6vh,36px);font-weight:900;color:var(--green-deep);
            background:var(--green-pale);border:3px solid var(--green-deep);
            border-radius:14px;padding:5px 24px;margin-top:6px}
.confirm .btns{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:26px}
.bOK{min-height:88px;border-radius:18px;background:var(--green);border:4px solid var(--green-deep);
     color:#fff;font-size:clamp(27px,4.4vh,33px);font-weight:900}
.bNG{min-height:74px;border-radius:18px;background:#fff;border:4px solid var(--ink);
     color:var(--ink);font-size:clamp(22px,3.5vh,27px);font-weight:900}

/* --- 起動アニメ --- */
.splash{position:absolute;inset:0;background:var(--pink-pale);display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:15px}
.appname{font-size:clamp(30px,5vh,38px);font-weight:900;color:#8E3A5C;letter-spacing:.06em}
.mold{position:relative;width:min(70vw,268px);aspect-ratio:760/616}
.mold .ghost,.mold .real{position:absolute;inset:0;background:no-repeat center/contain}
.mold .ghost{opacity:.26;filter:grayscale(1) brightness(.45) contrast(1.3)}
.mold .liq{position:absolute;inset:0;overflow:hidden;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center}
.mold .fill{position:absolute;left:-12%;right:-12%;bottom:0;height:64%;
            background:linear-gradient(180deg,#F8B9CD,#DE4E84)}
.mold .fill::before{content:"";position:absolute;left:0;right:0;top:-10px;height:20px;
  background:radial-gradient(circle at 11px 10px,#F8B9CD 11px,transparent 11.5px) repeat-x 0 0/22px 20px}
.meter{width:min(64vw,244px);height:22px;border-radius:999px;background:#fff;
       border:3px solid var(--pink-strong);overflow:hidden}
.meter i{display:block;height:100%;width:64%;background:var(--pink-strong);border-radius:999px}
.pct{font-size:clamp(26px,4.2vh,32px);font-weight:900;color:#B33E6B}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
       background:rgba(46,33,24,.93);color:#fff;font-size:clamp(28px,4.6vh,36px);font-weight:900;
       border-radius:22px;padding:22px 34px;text-align:center;line-height:1.3;white-space:nowrap}
.toast div{font-size:.6em;font-weight:800;margin-top:8px;opacity:.9}
</style>
</head>
<body>
<div class="page">
<h1>かけい簿 ─ 画面レイアウト案</h1>
<p class="sub">実際のCSSで組んだ原寸イメージです（枠内＝スマホ画面 360×740px 相当）。文字・ボタンの大きさもこのままです。</p>
<div class="row" id="row"></div>
</div>
<script>
const IC={
 life:'<svg viewBox="0 0 24 24" fill="none" stroke="#B0763C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-1.5 11a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
 water:'<svg viewBox="0 0 24 24" fill="none" stroke="#2F7AA8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.4 6 10.4A6 6 0 0 1 6 13.4C6 9.4 12 3 12 3Z"/></svg>',
 power:'<svg viewBox="0 0 24 24" fill="none" stroke="#D99400" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12Z"/></svg>',
 gas:'<svg viewBox="0 0 24 24" fill="none" stroke="#E05A2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a6 6 0 0 0 6-6c0-5-6-11-6-11S6 11 6 16a6 6 0 0 0 6 6Z"/><path d="M12 19a2.6 2.6 0 0 0 2.6-2.6c0-2-2.6-4.4-2.6-4.4s-2.6 2.4-2.6 4.4A2.6 2.6 0 0 0 12 19Z"/></svg>',
 phone:'<svg viewBox="0 0 24 24" fill="none" stroke="#5B8C3F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/><path d="M10.5 18.5h3"/></svg>',
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="#C23A6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5h3.3L8 6h8l1.7 2.5H21v11H3Z"/><circle cx="12" cy="14" r="3.6"/></svg>',
 mic:'<svg viewBox="0 0 24 24" fill="none" stroke="#3C7528" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5"/></svg>',
 hand:'<svg viewBox="0 0 24 24" fill="none" stroke="#5A4A3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M6.5 14h11"/></svg>',
 send:'<svg viewBox="0 0 24 24" fill="none" stroke="#3C7528" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:1.15em;height:1.15em"><path d="m21 3-9.5 9.5M21 3l-6.5 18-4-8-8-4Z"/></svg>'};
const CATS=[['life','生活費'],['water','水道代'],['power','電気代'],['gas','ガス代'],['phone','携帯代']];
const yen=n=>n.toLocaleString('ja-JP');
const SEP={life:82300,water:0,power:9860,gas:5200,phone:4378};
const AUG={life:96400,water:4120,power:8340,gas:6780,phone:4378};
const JUL={life:88100,water:0,power:9900,gas:5400,phone:4378};
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);

function chart(cur,prev){
  const max=Math.max(1,...Object.values(cur),...Object.values(prev));
  return CATS.map(([k,label])=>{
    const c=cur[k]||0,p=prev[k]||0;
    const amt=c>0?`<div class="amt">${yen(c)}<small>円</small></div>`:`<div class="none">まだ ありません</div>`;
    let bars='';
    if(c>0)bars+=`<div class="bar" style="width:${Math.max(5,c/max*100)}%"></div>`;
    if(p>0)bars+=`<div class="bar prev" style="width:${Math.max(5,p/max*100)}%"></div>`;
    if(!bars)bars=`<div class="bar" style="width:0;visibility:hidden"></div>`;
    return `<div class="cat"><div class="top"><div class="name">${IC[k]}${label}</div>${amt}</div>
      <div class="bars">${bars}</div></div>`;
  }).join('');
}
const head=(cur,prev,lblA,lblB,past,navR)=>`
  <div class="nav"><button class="navbtn">← 先月</button>${navR}</div>
  <div class="total">
    <div class="lbl">${lblA}に つかった お金${past?'<span class="badge">過去の記録</span>':''}</div>
    <div class="yen">${yen(sum(cur))}<small>円</small></div>
  </div>
  <div class="legend"><span><i class="a"></i>${lblA}</span><span><i class="b"></i>${lblB}</span></div>
  <div class="chart">${chart(cur,prev)}</div>`;

const NOW=(extra='',foot=null)=>`<div class="app">
  ${head(SEP,AUG,'9月','8月',false,'<button class="navbtn hide">→ 今月へ</button>')}
  ${foot!==null?foot:`<div class="foot">
    <img class="chars" src="../assets/chars.png" alt="">
    <button class="plus"><span class="p">＋</span><span class="t">入力</span></button>
    <button class="send">${IC.send}送る</button></div>`}
  ${extra}</div>`;

const PAST=`<div class="app past">
  ${head(AUG,JUL,'8月','7月',true,'<button class="navbtn now">→ 今月へ</button>')}
  <div class="foot">
    <img class="chars" src="../assets/chars.png" alt="" style="width:clamp(150px,26vh,210px)">
    <div class="viewonly">見るだけの<br>がめんです</div>
  </div></div>`;

const SHEET=NOW(`<div class="scrim"></div><div class="sheet">
  <h2>どうやって 入れますか？</h2>
  <button class="opt one">${IC.cam}<span>レシートを うつす<span class="s">カメラで よみとります</span></span></button>
  <button class="opt two">${IC.mic}<span>こえで 入れる<span class="s">「でんきだい 5000円」</span></span></button>
  <button class="opt">${IC.hand}<span>てで 入れる<span class="s">数字を おします</span></span></button>
  <button class="del">さいごの入力を 消す</button>
  <button class="close">とじる</button></div>`, '<div class="foot"></div>');

const KEYS=NOW(`<div class="scrim"></div><div class="sheet">
  <p class="khead">いくら つかいましたか？</p>
  <div class="kfield">1,280<span class="u">円</span></div>
  <div class="keys">
    <button class="key">1</button><button class="key">2</button><button class="key">3</button>
    <button class="key">4</button><button class="key">5</button><button class="key">6</button>
    <button class="key">7</button><button class="key">8</button><button class="key">9</button>
    <button class="key fn">けす</button><button class="key">0</button><button class="key ok">つぎへ</button>
  </div><button class="close">やめる</button></div>`, '<div class="foot"></div>');

const CATSEL=NOW(`<div class="scrim"></div><div class="sheet">
  <p class="khead">1,280円 は なんですか？</p>
  <div class="catgrid">${CATS.map(([k,l],i)=>`<button class="catbtn${i===0?' sel':''}">${IC[k]}${l}</button>`).join('')}</div>
  <button class="close">やめる</button></div>`, '<div class="foot"></div>');

const CONFIRM=`<div class="app"><div class="confirm">
  <div class="q">これで よろしいですか？</div>
  <div class="big">1,280<small>円</small></div>
  <div class="c">生活費</div>
  <div class="btns"><button class="bOK">これで OK</button><button class="bNG">やり直す</button></div>
</div></div>`;

const SAVED=`<div class="app">
  ${(()=>{const s={...SEP,life:SEP.life+1280};return `
  <div class="nav"><button class="navbtn">← 先月</button><button class="navbtn hide">→</button></div>
  <div class="total"><div class="lbl">9月に つかった お金</div><div class="yen">${yen(sum(s))}<small>円</small></div></div>
  <div class="legend"><span><i class="a"></i>9月</span><span><i class="b"></i>8月</span></div>
  <div class="chart">${chart(s,AUG)}</div>`})()}
  <div class="foot"><img class="chars" src="../assets/chars.png" alt="">
    <button class="plus"><span class="p">＋</span><span class="t">入力</span></button>
    <button class="send">${IC.send}送る</button></div>
  <div class="scrim" style="background:rgba(46,33,24,.34)"></div>
  <div class="toast">保存しました<div>生活費 1,280円</div></div></div>`;

const SPLASH=`<div class="app"><div class="splash">
  <div class="appname">かけい簿</div>
  <div class="mold">
    <div class="ghost" style="background-image:url(../assets/chars.png)"></div>
    <div class="liq" style="-webkit-mask-image:url(../assets/chars.png);mask-image:url(../assets/chars.png)">
      <div class="fill"></div></div>
  </div>
  <div class="pct">64%</div>
  <div class="meter"><i></i></div></div></div>`;

const screens=[
 ['① 今月の画面','ふだん見る画面。＋と送るが出ています',NOW()],
 ['② 過去の月の画面','背景もグラフも青。＋は消して「見るだけ」',PAST],
 ['③ ＋ を押したところ','入力3つ＋「さいごの入力を消す」',SHEET],
 ['④ てで 入れる','アプリの中の大きなテンキー',KEYS],
 ['⑤ なにに 使った？','大きなボタン5つ。生活費が最初から選択ずみ',CATSEL],
 ['⑥ 保存まえの確認','カメラ・こえ・手入力、どれでも必ずここを通ります',CONFIRM],
 ['⑦ 保存しました','2秒ほどで自動で消えます',SAVED],
 ['⑧ 起動アニメーション','たぬきの形に色がたまる（0→100%・3秒）',SPLASH],
];
document.getElementById('row').innerHTML=screens.map(([t,s,h])=>
 `<div class="frame"><p class="cap">${t}<small>${s}</small></p><div class="phone">${h}</div></div>`).join('');

/* 起動アニメを動かして見せる（モック用） */
(function(){
  const fill=document.querySelector('.mold .fill'),
        meter=document.querySelector('.meter i'),
        pct=document.querySelector('.pct');
  if(!fill) return;
  let t0=null;
  function tick(t){
    if(t0===null) t0=t;
    const p=Math.min(1,(t-t0)/3000);
    const e=p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    fill.style.height=(e*104)+'%';
    meter.style.width=(p*100)+'%';
    pct.textContent=Math.round(p*100)+'%';
    if(p>=1){ setTimeout(()=>{ t0=null; requestAnimationFrame(tick); },1100); return; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
